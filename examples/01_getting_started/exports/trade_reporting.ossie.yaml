version: 0.2.0.dev0
semantic_model:
- name: emir_mifir_trade_reporting
  description: Synthetic EMIR/MiFIR regulatory reporting schema used in the Hikari Labs semantic
    layer benchmark.
  ai_context:
    instructions: 'Amounts are unsigned unless stated otherwise; direction always comes from
      a code column, never from an amount sign. Glossary — UTI: Unique Trade Identifier per
      ISO 23897; notional: unsigned contract size - not exposure; exposure: signed mark-to-market
      valuation (trade_valuations); NFC+: non-financial counterparty above the clearing threshold'
  custom_extensions:
  - vendor_name: SEMANTIDO
    data: '{"concept_registry": {"concepts": {"counterparty.emir": {"definition": "EMIR Article
      9: either of the two entities party to a derivative contract. Both sides report, and
      both appear on the contract.", "definition_checksum": "25b4434341d9", "grain": "legal_entity",
      "label": "Counterparty", "relations": [{"concept": "party.mifir", "relation": "distinct_from"}],
      "synonyms": ["counterparty", "cpty"]}, "isin": {"definition": "ISO 6166 identifier.
      Identifies an issue \u2014 one security as issued, irrespective of where it trades.",
      "definition_checksum": "2fb0ba62a381", "grain": "issue", "label": "isin", "relations":
      [{"concept": "uti", "relation": "distinct_from"}], "synonyms": ["ISIN"]}, "lei": {"definition":
      "ISO 17442 Legal Entity Identifier. Identifies a legal entity, not a trading relationship
      and not an account.", "definition_checksum": "5723bdf8c5d1", "grain": "legal_entity",
      "label": "lei", "synonyms": ["LEI"]}, "notional": {"definition": "Unsigned contract
      size, per contract. Not exposure and not market value. Economic direction lives in the
      direction code, never in the sign of this amount.", "definition_checksum": "63cb78fae954",
      "grain": "contract", "label": "notional", "relations": [{"concept": "valuation", "relation":
      "distinct_from"}, {"concept": "price", "relation": "distinct_from"}], "synonyms": ["notional
      amount", "contract size"]}, "party.mifir": {"definition": "MiFIR RTS 22: the buyer or
      seller in a transaction report. A client on whose behalf the firm deals is a buyer or
      seller here \u2014 it is NOT the EMIR counterparty, even though the same legal entity
      may occupy both roles on the same trade.", "definition_checksum": "a4596ac4a8c1", "grain":
      "legal_entity", "label": "Buyer or seller", "relations": [{"concept": "counterparty.emir",
      "relation": "distinct_from"}], "synonyms": ["buyer", "seller"]}, "price": {"definition":
      "Execution price of a single transaction, in the venue''s quote convention. Per execution,
      not per contract.", "definition_checksum": "8ae4f318f288", "grain": "execution", "label":
      "price", "relations": [{"concept": "notional", "relation": "distinct_from"}, {"concept":
      "valuation", "relation": "distinct_from"}], "synonyms": ["execution price"]}, "transaction_reference":
      {"definition": "MiFIR RTS 22 transaction reference. Identifies one execution on a venue.
      A single block execution may be allocated into many contracts, so this is a finer grain
      than the UTI.", "definition_checksum": "81efed8efaef", "grain": "execution", "label":
      "transaction reference", "relations": [{"concept": "uti", "relation": "distinct_from"}],
      "synonyms": ["transaction reference"]}, "uti": {"definition": "Unique Trade Identifier
      per ISO 23897. Identifies one derivative contract, shared bilaterally: both counterparties
      report the same UTI to their respective trade repositories.", "definition_checksum":
      "2cd122af38b4", "grain": "contract", "label": "uti", "relations": [{"concept": "transaction_reference",
      "relation": "distinct_from"}, {"concept": "isin", "relation": "distinct_from"}], "synonyms":
      ["UTI", "trade identifier"]}, "valuation": {"definition": "Signed mark-to-market valuation
      of a contract on a given date. Changes daily while the notional does not.", "definition_checksum":
      "27733bd8fca8", "grain": "contract_date", "label": "valuation", "relations": [{"concept":
      "notional", "relation": "distinct_from"}, {"concept": "price", "relation": "distinct_from"}],
      "synonyms": ["mark to market", "MTM", "exposure"]}}, "sources": {}}, "exporter": "semantido.exporters.ossie"}'
  datasets:
  - name: counterparties
    source: counterparties
    primary_key:
    - counterparty_id
    unique_keys:
    - - lei
    description: Legal entities that are party to reportable derivative trades. One row per
      LEI. Includes both reporting counterparties and their trade counterparties (clients,
      CCPs, brokers).
    ai_context:
      instructions: 'Reference data — updated via nightly GLEIF sync. EMIR Art. 9 counterparty
        classification drives reporting obligations: FC (financial), NFC+ (non-financial above
        clearing threshold), NFC- (below threshold).'
      synonyms:
      - legal entity
      - client
      - trading party
      - LEI record
    fields:
    - name: counterparty_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: counterparty_id
      description: 'Column: counterparty_id'
    - name: lei
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: lei
      description: ISO 17442 Legal Entity Identifier (20 characters).
      ai_context:
        synonyms:
        - legal entity identifier
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"concept": "lei", "privacy_level": "internal", "sample_values": ["529900T8BM49AURSDO55",
          "213800MBWEIJDM5CU638"]}'
    - name: legal_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: legal_name
      description: Registered legal name of the entity.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"privacy_level": "confidential"}'
    - name: emir_classification
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: emir_classification
      description: 'EMIR counterparty classification: FC, NFC+ or NFC-.'
      ai_context:
        synonyms:
        - counterparty type
        - EMIR category
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"sample_values": ["FC", "NFC+", "NFC-"]}'
    - name: jurisdiction
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: jurisdiction
      description: ISO 3166-1 alpha-2 country of incorporation.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"sample_values": ["GB", "DE", "FR", "US"]}'
    - name: is_ccp
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: is_ccp
      description: True when the entity is a central counterparty (clearing house).
  - name: instruments
    source: instruments
    primary_key:
    - instrument_id
    description: Financial instruments referenced by trades. One row per ISIN (or internal
      identifier for OTC products without an ISIN).
    ai_context:
      instructions: asset_class follows the EMIR taxonomy (IR, CR, EQ, FX, CO). cfi_code is
        the ISO 10962 classification used for MiFIR field 43.
      synonyms:
      - product
      - security
      - derivative contract
    fields:
    - name: instrument_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: instrument_id
      description: 'Column: instrument_id'
    - name: isin
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: isin
      description: ISO 6166 ISIN. NULL for bespoke OTC products with no ISIN; such products
        are identified by instrument_id only.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"concept": "isin", "sample_values": ["EZ9VVV8CQC69", "DE000C6900B7"]}'
    - name: asset_class
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: asset_class
      description: 'EMIR asset class: IR, CR, EQ, FX or CO.'
      ai_context:
        synonyms:
        - product class
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"sample_values": ["IR", "FX", "CR"]}'
    - name: cfi_code
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: cfi_code
      description: ISO 10962 CFI classification code.
    - name: notional_currency
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: notional_currency
      description: ISO 4217 currency of the notional amount.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"sample_values": ["EUR", "USD", "GBP"]}'
  - name: mifir_transactions
    source: mifir_transactions
    primary_key:
    - transaction_id
    unique_keys:
    - - transaction_reference
    description: MiFIR Art. 26 transaction reports. Transaction-level executions reported
      to the NCA — related to but distinct from EMIR trade reports (different scope, different
      lifecycle).
    ai_context:
      instructions: 'quantity and price are per MiFIR RTS 22: price excludes commission and
        accrued interest. buyer/seller are LEI references, not signed quantities — do not
        infer direction from quantity sign.'
      synonyms:
      - MiFIR reports
      - transaction reports
      - RTS 22 reports
    custom_extensions:
    - vendor_name: SEMANTIDO
      data: '{"sql_filters": ["report_status = ''ACPT''  -- accepted reports only"]}'
    fields:
    - name: transaction_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: transaction_id
      description: 'Column: transaction_id'
    - name: transaction_reference
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: transaction_reference
      description: Firm-assigned transaction reference number (MiFIR field 2).
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"concept": "transaction_reference"}'
    - name: instrument_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: instrument_id
      description: 'Column: instrument_id'
    - name: buyer_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: buyer_id
      description: MiFIR buyer. Not the EMIR counterparty.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"concept": "party.mifir"}'
    - name: seller_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: seller_id
      description: MiFIR seller. Not the EMIR counterparty.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"concept": "party.mifir"}'
    - name: trading_datetime
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: trading_datetime
      description: UTC execution timestamp (MiFIR field 28). Primary time axis.
      dimension:
        is_time: true
      ai_context:
        instructions: 'PRIMARY time dimension for this dataset. Native grain: second.'
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"is_primary_time_dimension": true, "time_grain": "second"}'
    - name: price
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: price
      description: Execution price excluding commission and accrued interest (field 33).
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"concept": "price"}'
    - name: quantity
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: quantity
      description: Unsigned quantity (field 30). Direction is buyer_id/seller_id, never quantity
        sign.
      ai_context:
        instructions: Always positive; do not infer buy/sell from sign.
    - name: venue_mic
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: venue_mic
      description: Execution venue MIC (field 36); 'XOFF' for off-venue.
    - name: report_status
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: report_status
      description: 'NCA processing status: ACPT, RJCT or PDNG.'
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"sample_values": ["ACPT", "RJCT"]}'
  - name: trade_parties
    source: trade_parties
    primary_key:
    - trade_party_id
    description: Bridge table assigning counterparties to trades in specific roles. A trade
      has at least two rows here (REPORTING and OTHER), plus optional CCP, BROKER and CLEARING_MEMBER
      rows.
    ai_context:
      instructions: 'This is a fan-out bridge: joining trade_reports to trade_parties multiplies
        trade rows by the number of roles. Aggregations over trade amounts MUST filter on
        a single role (usually ''REPORTING'').'
      synonyms:
      - trade counterparty roles
      - party roles
    fields:
    - name: trade_party_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: trade_party_id
      description: 'Column: trade_party_id'
    - name: trade_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: trade_id
      description: 'Column: trade_id'
    - name: counterparty_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: counterparty_id
      description: The EMIR-sense counterparty on this contract. NOT interchangeable with
        the MiFIR buyer/seller on mifir_transactions, even when the same legal entity occupies
        both roles.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"concept": "counterparty.emir"}'
    - name: role
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: role
      description: 'Role of the counterparty on the trade: REPORTING, OTHER, CCP, BROKER or
        CLEARING_MEMBER.'
      ai_context:
        instructions: Always filter to one role before aggregating trade amounts.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"sample_values": ["REPORTING", "OTHER", "CCP"]}'
  - name: trade_reports
    source: trade_reports
    primary_key:
    - trade_id
    unique_keys:
    - - uti
    description: EMIR trade reports (trade state view). One row per UTI representing the latest
      reported state of a derivative trade.
    ai_context:
      instructions: Sourced from the trade repository submission feed; refreshed T+1. notional_amount
        is ALWAYS POSITIVE regardless of direction. The economic side of the reporting counterparty
        is in `direction` (BYER = buyer/payer, SLLR = seller/receiver). Never infer sign from
        the amount. To aggregate exposure, join counterparties via trade_parties and filter
        role = 'REPORTING' to avoid fan-out.
      synonyms:
      - trades
      - derivative trades
      - EMIR reports
      - trade state
    custom_extensions:
    - vendor_name: SEMANTIDO
      data: '{"sql_filters": ["action_type != ''E''  -- exclude error-cancelled reports"]}'
    fields:
    - name: trade_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: trade_id
      description: 'Column: trade_id'
    - name: uti
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: uti
      description: Unique Trade Identifier (ISO 23897), max 52 chars.
      ai_context:
        synonyms:
        - trade identifier
        - UTI
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"concept": "uti", "privacy_level": "internal"}'
    - name: instrument_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: instrument_id
      description: 'Column: instrument_id'
    - name: execution_timestamp
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: execution_timestamp
      description: UTC timestamp when the trade was executed. Primary business time axis.
      dimension:
        is_time: true
      ai_context:
        synonyms:
        - trade date
        - execution time
        instructions: 'PRIMARY time dimension for this dataset. Native grain: second.'
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"is_primary_time_dimension": true, "time_grain": "second"}'
    - name: effective_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: effective_date
      description: Date the contract obligations become effective.
      dimension:
        is_time: true
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"time_grain": "day"}'
    - name: maturity_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: maturity_date
      description: Contract maturity/expiry date. NULL for open-ended.
      dimension:
        is_time: true
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"time_grain": "day"}'
    - name: notional_amount
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: notional_amount
      description: Trade notional in notional_currency. Always positive; direction of risk
        is given by `direction`, never by sign.
      ai_context:
        synonyms:
        - notional
        - trade size
        instructions: Never SUM across both trade_parties roles — double counts. Sign is always
          positive; use direction for buy/sell split.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"concept": "notional"}'
    - name: direction
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: direction
      description: 'Side of the reporting counterparty: BYER (buyer/payer leg) or SLLR (seller/receiver
        leg).'
      ai_context:
        synonyms:
        - side
        - buy/sell indicator
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"sample_values": ["BYER", "SLLR"]}'
    - name: action_type
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: action_type
      description: 'EMIR action type of the latest report: N=New, M=Modify, C=Terminate, E=Error,
        R=Correction, V=Valuation update.'
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"sample_values": ["N", "M", "C"]}'
    - name: cleared
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: cleared
      description: True when cleared through a CCP.
    - name: venue_mic
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: venue_mic
      description: ISO 10383 MIC of the execution venue. 'XXXX' or NULL for pure OTC.
    - name: created_at
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: created_at
      description: Row load timestamp (ETL audit only).
      ai_context:
        instructions: Operational audit timestamp — do not use as a time axis for business
          questions.
  - name: trade_valuations
    source: trade_valuations
    primary_key:
    - valuation_id
    description: Daily mark-to-market valuations per trade (EMIR Art. 11 / action type V).
      One row per trade per valuation date.
    ai_context:
      instructions: 'valuation_amount is SIGNED from the reporting counterparty''s perspective:
        positive = asset (in the money), negative = liability. This differs from notional_amount
        on trade_reports, which is unsigned. ''Exposure'' questions usually mean valuation,
        not notional.'
      synonyms:
      - valuations
      - MTM
      - mark-to-market
    fields:
    - name: valuation_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: valuation_id
      description: 'Column: valuation_id'
    - name: trade_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: trade_id
      description: 'Column: trade_id'
    - name: valuation_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: valuation_date
      description: Business date of the valuation.
      dimension:
        is_time: true
      ai_context:
        instructions: 'PRIMARY time dimension for this dataset. Native grain: day.'
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"is_primary_time_dimension": true, "time_grain": "day"}'
    - name: valuation_amount
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: valuation_amount
      description: Signed mark-to-market value from the reporting counterparty's view. Positive
        = in the money; negative = out of the money.
      ai_context:
        synonyms:
        - MTM value
        - mark to market
        - exposure
        instructions: Signed — do not take ABS() unless the question asks for gross MTM. For
          'current exposure' use the latest valuation_date per trade.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"concept": "valuation"}'
    - name: valuation_currency
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: valuation_currency
      description: ISO 4217 currency of valuation_amount.
    - name: valuation_type
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: valuation_type
      description: MTMV = mark-to-market, MTMO = mark-to-model.
      custom_extensions:
      - vendor_name: SEMANTIDO
        data: '{"sample_values": ["MTMV", "MTMO"]}'
    - name: updated_at
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: updated_at
      description: Row update timestamp (ETL audit only).
      ai_context:
        instructions: Operational audit timestamp — do not use as a time axis for business
          questions.
  relationships:
  - name: trade_parties_to_counterparties
    from: trade_parties
    to: counterparties
    from_columns:
    - counterparty_id
    to_columns:
    - counterparty_id
    ai_context:
      instructions: Relationship between counterparties and trade_parties
    custom_extensions:
    - vendor_name: SEMANTIDO
      data: '{"relationship_type": "many-to-one"}'
  - name: trade_reports_to_instruments
    from: trade_reports
    to: instruments
    from_columns:
    - instrument_id
    to_columns:
    - instrument_id
    ai_context:
      instructions: Relationship between instruments and trade_reports
    custom_extensions:
    - vendor_name: SEMANTIDO
      data: '{"relationship_type": "many-to-one"}'
  - name: mifir_transactions_to_counterparties
    from: mifir_transactions
    to: counterparties
    from_columns:
    - buyer_id
    to_columns:
    - counterparty_id
    ai_context:
      instructions: The buying counterparty (LEI reference)
    custom_extensions:
    - vendor_name: SEMANTIDO
      data: '{"relationship_type": "many-to-one"}'
  - name: mifir_transactions_to_counterparties
    from: mifir_transactions
    to: counterparties
    from_columns:
    - seller_id
    to_columns:
    - counterparty_id
    ai_context:
      instructions: The selling counterparty (LEI reference)
    custom_extensions:
    - vendor_name: SEMANTIDO
      data: '{"relationship_type": "many-to-one"}'
  - name: trade_parties_to_trade_reports
    from: trade_parties
    to: trade_reports
    from_columns:
    - trade_id
    to_columns:
    - trade_id
    ai_context:
      instructions: Relationship between trade_parties and trade_reports
    custom_extensions:
    - vendor_name: SEMANTIDO
      data: '{"relationship_type": "many-to-one"}'
  - name: trade_valuations_to_trade_reports
    from: trade_valuations
    to: trade_reports
    from_columns:
    - trade_id
    to_columns:
    - trade_id
    ai_context:
      instructions: Daily mark-to-market valuation history for this trade
    custom_extensions:
    - vendor_name: SEMANTIDO
      data: '{"relationship_type": "many-to-one"}'
